# 固定 Compose 项目名，避免历史误拼写继续生成错误命名的容器和数据卷。
name: know-where

services:
  app:
    image: knowwhere:local
    build:
      context: .
      args:
        # Compose 从项目根目录 .env 读取 ASR 选择，并据此裁剪镜像依赖。
        KW_ASR_PROVIDER: ${KW_ASR_PROVIDER:-faster_whisper}
    env_file:
      # PostgreSQL 连接由用户在 .env 的 KW_DATABASE_URL 中提供。
      - .env
    volumes:
      # 本地 ASR 模型与工作目录分卷，清理临时文件不会删除模型。
      - asr-models:/var/lib/knowwhere/models
      - media-temp:/var/lib/knowwhere/temp
    command: ["migrate-and-health"]

  gateway:
    profiles: ["gateway"]
    image: knowwhere:local
    build:
      context: .
      args:
        # Gateway 与管理命令必须使用同一种 ASR 构建变体。
        KW_ASR_PROVIDER: ${KW_ASR_PROVIDER:-faster_whisper}
    env_file:
      # Gateway 与管理命令共用用户提供的远端 PostgreSQL 连接。
      - .env
    volumes:
      # Gateway 复用已下载模型，并保存任务级本地工作目录。
      - asr-models:/var/lib/knowwhere/models
      - media-temp:/var/lib/knowwhere/temp
    command: ["gateway"]
    restart: unless-stopped

volumes:
  # faster-whisper 模型缓存。
  asr-models:
  # 可按 KW_TEMP_DELETE_AFTER_PROCESS 清理或保留的媒体临时卷。
  media-temp:
